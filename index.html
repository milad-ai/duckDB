<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DuckDB Playground</title>

    <link rel="stylesheet" href="./pyscript/core.css" />
    <script type="module" src="./pyscript/core.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 32px 20px;
            direction: ltr;
            text-align: left;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 12px #fbbf24;
        }

        header p {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .editor {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #1a2332;
            border-bottom: 1px solid #334155;
        }

        .editor-header .label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dots span:nth-child(1) { background: #ef4444; }
        .dots span:nth-child(2) { background: #fbbf24; }
        .dots span:nth-child(3) { background: #22c55e; }

        textarea {
            width: 100%;
            min-height: 140px;
            background: #0f172a;
            color: #7dd3fc;
            border: none;
            padding: 16px;
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        textarea::placeholder {
            color: #475569;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #1a2332;
            border-top: 1px solid #334155;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        #run-btn {
            background: #fbbf24;
            color: #0f172a;
        }

        #run-btn:hover {
            background: #f59e0b;
            transform: translateY(-1px);
        }

        #clear-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        #clear-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .output-wrapper {
            margin-top: 24px;
        }

        .output-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #output {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
            font-size: 13px;
            color: #86efac;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 60px;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
        }

        #output.error {
            color: #fca5a5;
        }

        .hint {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.6;
        }

        .hint code {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            color: #7dd3fc;
            font-family: monospace;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #fbbf24;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="dot"></span> DuckDB Playground</h1>
            <p>Write SQL queries and run them directly in your browser.</p>
        </header>

        <div class="editor">
            <div class="editor-header">
                <div class="dots">
                    <span></span><span></span><span></span>
                </div>
                <div class="label">query.sql</div>
            </div>

            <textarea id="sql-input" spellcheck="false" placeholder="SELECT 'Hello DuckDB!' AS message;">SELECT
    'Hello DuckDB!' AS message,
    42 AS answer,
    version() AS engine;</textarea>

            <div class="toolbar">
                <button id="run-btn">▶  Run Query</button>
                <button id="clear-btn">Clear</button>
            </div>
        </div>

        <div class="output-wrapper">
            <div class="output-label">Result</div>
            <div id="output">Ready.</div>
        </div>

        <div class="hint">
            💡 Try: <code>SELECT * FROM range(5);</code> or
            <code>SELECT 1+1 AS sum;</code> — all queries run locally in your browser.
        </div>
    </div>

    <script type="py" config='{"packages":["duckdb"], "pyodide_url":"./pyscript/pyodide/pyodide.js"}'>
        import duckdb
        from pyscript import document, when

        @when("click", "#run-btn")
        def run_query(event):
            query = document.getElementById("sql-input").value.strip()
            output = document.getElementById("output")

            if not query:
                output.classList.add("error")
                output.innerText = "Please enter a query."
                return

            output.classList.remove("error")
            output.innerText = "Running..."

            try:
                result = duckdb.sql(query).fetchall()
                if not result:
                    output.innerText = "Query executed successfully. (no rows returned)"
                else:
                    lines = []
                    for row in result:
                        lines.append(str(row))
                    output.innerText = "\n".join(lines)
            except Exception as e:
                output.classList.add("error")
                output.innerText = f"Error: {e}"

        @when("click", "#clear-btn")
        def clear_output(event):
            document.getElementById("output").innerText = ""
            document.getElementById("output").classList.remove("error")
    </script>
</body>
</html>
