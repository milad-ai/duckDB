<!doctype html>
<html lang="en" dir="ltr" data-theme="midnight">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DuckDB Playground</title>

<!-- PyScript لوکال -->
<link rel="stylesheet" href="./pyscript/core.css" />
<script type="module" src="./pyscript/core.js"></script>

<style>
/* ─────────── themes ─────────── */
:root{
  --r: 10px;
  --code-fs: 15px;
  --mono: "JetBrains Mono","Fira Code","SF Mono",Consolas,ui-monospace,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
}
[data-theme="midnight"]{
  --bg:#0b1220; --surface:#111c2e; --surface-2:#0e1728; --line:#22314a;
  --fg:#e6edf7; --dim:#8da2bf; --accent:#f5b544; --accent-fg:#101a2b;
  --code:#9fd6ff; --ok:#7fe0a8; --err:#ff9a9a; --sel:#1d3454;
}
[data-theme="carbon"]{
  --bg:#101010; --surface:#191919; --surface-2:#141414; --line:#2b2b2b;
  --fg:#ededed; --dim:#8f8f8f; --accent:#e4e4e4; --accent-fg:#111;
  --code:#d7d7d7; --ok:#9ad59a; --err:#e39b9b; --sel:#2e2e2e;
}
[data-theme="nord"]{
  --bg:#242933; --surface:#2e3440; --surface-2:#2a303c; --line:#3f4859;
  --fg:#e5e9f0; --dim:#94a0b4; --accent:#88c0d0; --accent-fg:#1f242d;
  --code:#a3be8c; --ok:#a3be8c; --err:#bf616a; --sel:#3b4252;
}
[data-theme="ember"]{
  --bg:#17110c; --surface:#211812; --surface-2:#1b130e; --line:#3a2a1d;
  --fg:#f2e4d4; --dim:#b2957a; --accent:#ff9d3d; --accent-fg:#1a1009;
  --code:#ffcf8f; --ok:#c9d97a; --err:#ff8a7a; --sel:#3b2718;
}
[data-theme="paper"]{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#faf9f6; --line:#e2dfd6;
  --fg:#1d1c1a; --dim:#6f6b63; --accent:#1f6f5c; --accent-fg:#ffffff;
  --code:#1b4f6b; --ok:#1f6f5c; --err:#a33a2c; --sel:#e8f0ec;
}
[data-theme="daylight"]{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f7f9fc; --line:#dde4ee;
  --fg:#16202e; --dim:#5f7085; --accent:#2f6df6; --accent-fg:#ffffff;
  --code:#0f3d8a; --ok:#137a4c; --err:#b5281f; --sel:#e3ecff;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:14px;
  overflow:hidden;
}
button,select,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ─────────── shell ─────────── */
.app{height:100vh;display:flex;flex-direction:column;background:var(--bg)}

.bar{
  display:flex;align-items:center;gap:14px;
  padding:0 14px;height:52px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:var(--surface-2);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em}
.brand .mark{
  width:22px;height:22px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:var(--accent-fg);font-size:12px;font-weight:800;
}
.brand small{display:block;font-weight:450;color:var(--dim);font-size:11.5px;letter-spacing:0}
.spacer{flex:1}

.ctl{display:flex;align-items:center;gap:6px}
.chip{
  display:flex;align-items:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;
}
.icon{
  background:transparent;border:0;border-radius:6px;cursor:pointer;
  width:30px;height:28px;display:grid;place-items:center;color:var(--dim);
  font-size:13px;font-weight:600;transition:background .15s,color .15s;
}
.icon:hover{background:var(--sel);color:var(--fg)}
select{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  height:32px;padding:0 8px;cursor:pointer;font-size:13px;
}
.run{
  background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;
  height:32px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:filter .15s;
}
.run:hover{filter:brightness(1.08)}
.run kbd{font:inherit;font-size:11px;opacity:.6;font-family:var(--mono)}
.ghost{
  background:transparent;border:1px solid var(--line);border-radius:8px;
  height:32px;padding:0 12px;font-size:13px;cursor:pointer;color:var(--dim);
}
.ghost:hover{background:var(--sel);color:var(--fg)}

/* ─────────── workspace ─────────── */
.work{flex:1;min-height:0;display:grid;grid-template-columns:var(--sw,260px) 1fr}

aside{
  border-right:1px solid var(--line);background:var(--surface-2);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 12px 8px;color:var(--dim);font-size:12px;font-weight:600;
}
#schema{overflow:auto;padding:0 8px 12px;flex:1}
.empty{padding:14px 8px;color:var(--dim);font-size:12.5px;line-height:1.7}

.tbl{margin-bottom:2px}
.tbl-row{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 8px;border-radius:8px;cursor:pointer;
  background:transparent;border:0;text-align:left;font-size:13px;
}
.tbl-row:hover{background:var(--sel)}
.tbl-row .tw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tbl-row .n{color:var(--dim);font-size:11px;font-family:var(--mono)}
.tbl-row .caret{color:var(--dim);font-size:10px;width:10px;transition:transform .15s}
.tbl.open .caret{transform:rotate(90deg)}
.cols{display:none;padding:2px 0 8px 26px}
.tbl.open .cols{display:block}
.col{display:flex;gap:8px;padding:3px 6px;font-family:var(--mono);font-size:12px;color:var(--fg)}
.col span{color:var(--dim)}
.peek{
  background:transparent;border:0;color:var(--dim);cursor:pointer;
  font-size:11px;padding:2px 6px;border-radius:6px;opacity:0;
}
.tbl-row:hover .peek{opacity:1}
.peek:hover{background:var(--accent);color:var(--accent-fg)}

/* ─────────── split ─────────── */
.split{display:grid;grid-template-rows:var(--eh,60%) 7px 1fr;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.pane-head{
  display:flex;align-items:center;gap:10px;
  padding:0 12px;height:38px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:var(--surface-2);
  font-size:12px;color:var(--dim);
}
.pane-head .name{font-family:var(--mono);color:var(--fg);font-size:12.5px}
.status{font-size:12px;color:var(--dim)}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}

.grab{
  cursor:row-resize;background:var(--bg);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.grab:hover{background:var(--sel)}

/* code area */
.code{flex:1;min-height:0;display:flex;background:var(--surface);overflow:hidden}
#gutter{
  padding:14px 10px 14px 14px;text-align:right;user-select:none;
  font-family:var(--mono);font-size:var(--code-fs);line-height:1.65;
  color:var(--dim);opacity:.5;overflow:hidden;white-space:pre;
}
#sql{
  flex:1;background:transparent;border:0;outline:0;resize:none;
  padding:14px 16px 14px 4px;color:var(--code);
  font-family:var(--mono);font-size:var(--code-fs);line-height:1.65;
  overflow:auto;tab-size:2;caret-color:var(--accent);
}
#sql::selection{background:var(--sel)}

/* result */
#output{flex:1;min-height:0;overflow:auto;padding:14px}
.msg{font-family:var(--mono);font-size:13px;color:var(--dim);line-height:1.7}
.msg.err{color:var(--err);white-space:pre-wrap}
table{border-collapse:collapse;font-size:13px;width:100%}
thead th{
  position:sticky;top:-14px;background:var(--surface-2);color:var(--accent);
  text-align:left;padding:8px 14px;font-weight:650;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
thead th small{display:block;font-weight:400;color:var(--dim);font-family:var(--mono);font-size:10.5px}
tbody td{
  padding:6px 14px;border-bottom:1px solid var(--line);
  font-family:var(--mono);white-space:nowrap;
}
tbody tr:hover td{background:var(--surface-2)}
tbody td.null{color:var(--dim);font-style:italic}

/* zen / fullscreen editor */
body.zen .work{grid-template-columns:1fr}
body.zen aside{display:none}
body.zen .split{grid-template-rows:1fr 0 0}
body.zen .grab,body.zen .pane.result{display:none}

/* mobile */
@media (max-width:860px){
  .work{grid-template-columns:1fr}
  aside{position:absolute;inset:52px auto 0 0;width:78%;max-width:300px;z-index:20;
        transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.side-open aside{transform:none}
  .brand small{display:none}
  .run kbd{display:none}
}
@media (min-width:861px){ #side-toggle{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>
<div class="app" id="app">

  <header class="bar">
    <button class="icon" id="side-toggle" title="Tables">☰</button>
    <div class="brand">
      <span class="mark">D</span>
      <span>DuckDB Playground<small>SQL in your browser</small></span>
    </div>

    <div class="spacer"></div>

    <div class="ctl">
      <select id="theme" title="Theme">
        <option value="midnight">Midnight</option>
        <option value="carbon">Carbon</option>
        <option value="nord">Nord</option>
        <option value="ember">Ember</option>
        <option value="paper">Paper</option>
        <option value="daylight">Daylight</option>
      </select>
      <div class="chip">
        <button class="icon" id="fs-down" title="Smaller text">A−</button>
        <button class="icon" id="fs-up" title="Larger text">A+</button>
      </div>
      <button class="icon" id="zen" title="Focus editor (F9)">⛶</button>
      <button class="icon" id="full" title="Full screen (F11)">⤢</button>
      <button class="ghost" id="clear-btn">Clear</button>
      <button class="run" id="run-btn">▶ Run <kbd>⌘↵</kbd></button>
    </div>
  </header>

  <main class="work">
    <aside>
      <div class="side-head">
        <span>Tables</span>
        <button class="icon" id="refresh-btn" title="Refresh">↻</button>
      </div>
      <div id="schema">
        <p class="empty">No tables yet. Run a <code>CREATE TABLE</code> statement and they'll appear here.</p>
      </div>
    </aside>

    <div class="split" id="split">
      <section class="pane">
        <div class="pane-head">
          <span class="name">query.sql</span>
          <span class="spacer"></span>
          <span class="status" id="hint">Ctrl/⌘ + Enter to run</span>
        </div>
        <div class="code">
          <div id="gutter">1</div>
          <textarea id="sql" spellcheck="false" autocomplete="off">CREATE TABLE students (
    id      INTEGER,
    name    VARCHAR,
    grade   INTEGER
);

INSERT INTO students VALUES
    (1, 'Ali',  18),
    (2, 'Sara', 20),
    (3, 'Reza', 15),
    (4, 'Mina', 19);

SELECT name, grade,
       CASE WHEN grade >= 18 THEN 'pass' ELSE 'retake' END AS result
FROM students
ORDER BY grade DESC;</textarea>
        </div>
      </section>

      <div class="grab" id="grab"></div>

      <section class="pane result">
        <div class="pane-head">
          <span>Result</span>
          <span class="spacer"></span>
          <button class="ghost" id="csv-btn" style="height:26px;padding:0 10px;font-size:12px">Download CSV</button>
          <span class="status" id="status">Loading Python engine…</span>
        </div>
        <div id="output"><p class="msg">Starting Pyodide and DuckDB. This takes a few seconds on first load.</p></div>
      </section>
    </div>
  </main>
</div>

<script>
/* ── UI: theme, zoom, layout, keys (plain JS so it works before Python loads) ── */
const $ = s => document.querySelector(s);
const root = document.documentElement, store = window.localStorage;

// theme
const theme = store.getItem("ddb-theme") || "midnight";
root.dataset.theme = theme; $("#theme").value = theme;
$("#theme").addEventListener("change", e => {
  root.dataset.theme = e.target.value; store.setItem("ddb-theme", e.target.value);
});

// font size
let fs = parseInt(store.getItem("ddb-fs") || "15", 10);
const applyFs = () => { root.style.setProperty("--code-fs", fs + "px"); store.setItem("ddb-fs", fs); };
applyFs();
$("#fs-up").onclick   = () => { fs = Math.min(26, fs + 1); applyFs(); };
$("#fs-down").onclick = () => { fs = Math.max(11, fs - 1); applyFs(); };

// zen + fullscreen
$("#zen").onclick = () => document.body.classList.toggle("zen");
$("#full").onclick = () => document.fullscreenElement
  ? document.exitFullscreen() : $("#app").requestFullscreen?.();
$("#side-toggle").onclick = () => document.body.classList.toggle("side-open");

// gutter line numbers
const ta = $("#sql"), gutter = $("#gutter");
function lines(){
  const n = ta.value.split("\n").length;
  gutter.textContent = Array.from({length:n}, (_,i) => i+1).join("\n");
  gutter.scrollTop = ta.scrollTop;
}
ta.addEventListener("input", lines);
ta.addEventListener("scroll", () => gutter.scrollTop = ta.scrollTop);
lines();

// tab inserts spaces
ta.addEventListener("keydown", e => {
  if (e.key === "Tab"){
    e.preventDefault();
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0,s) + "    " + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + 4;
    lines();
  }
});

// shortcuts
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); $("#run-btn").click(); }
  if (e.key === "F9"){ e.preventDefault(); $("#zen").click(); }
  if (e.key === "F11"){ e.preventDefault(); $("#full").click(); }
});

// resizable split
const split = $("#split"), grab = $("#grab");
const savedEh = store.getItem("ddb-eh"); if (savedEh) split.style.setProperty("--eh", savedEh);
let dragging = false;
grab.addEventListener("mousedown", () => { dragging = true; document.body.style.userSelect = "none"; });
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const r = split.getBoundingClientRect();
  const h = Math.min(Math.max(e.clientY - r.top, 120), r.height - 120) + "px";
  split.style.setProperty("--eh", h); store.setItem("ddb-eh", h);
});
window.addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
</script>

<!-- PyScript + Pyodide لوکال -->
<script type="py" config='{"packages":["micropip","duckdb"], "pyodide_url":"./pyscript/pyodide/pyodide.js"}'>
import html as _html
import time
import duckdb
from pyscript import document, when
from js import encodeURIComponent

con = duckdb.connect(":memory:")
last = {"cols": [], "rows": []}


def el(i):
    return document.getElementById(i)


def set_status(msg, kind=""):
    s = el("status")
    s.innerText = msg
    s.className = "status " + kind


def split_statements(sql):
    out, cur, quote = [], [], ""
    i, n = 0, len(sql)
    while i < n:
        ch = sql[i]
        if quote:
            cur.append(ch)
            if ch == quote:
                quote = ""
        elif ch in ("'", '"'):
            quote = ch
            cur.append(ch)
        elif ch == "-" and i + 1 < n and sql[i + 1] == "-":
            while i < n and sql[i] != "\n":
                i += 1
            cur.append("\n")
        elif ch == ";":
            s = "".join(cur).strip()
            if s:
                out.append(s)
            cur = []
        else:
            cur.append(ch)
        i += 1
    s = "".join(cur).strip()
    if s:
        out.append(s)
    return out


def render_table(cols, rows, types=None):
    h = ["<table><thead><tr>"]
    for idx, c in enumerate(cols):
        t = f"<small>{_html.escape(str(types[idx]))}</small>" if types else ""
        h.append(f"<th>{_html.escape(str(c))}{t}</th>")
    h.append("</tr></thead><tbody>")
    for r in rows[:2000]:
        h.append("<tr>")
        for cell in r:
            if cell is None:
                h.append('<td class="null">NULL</td>')
            else:
                h.append(f"<td>{_html.escape(str(cell))}</td>")
        h.append("</tr>")
    h.append("</tbody></table>")
    return "".join(h)


def refresh_schema():
    box = el("schema")
    try:
        tables = [r[0] for r in con.execute(
            "SELECT table_name FROM information_schema.tables "
            "WHERE table_schema = 'main' ORDER BY table_name"
        ).fetchall()]
    except Exception:
        tables = []

    if not tables:
        box.innerHTML = ('<p class="empty">No tables yet. Run a <code>CREATE TABLE</code> '
                         'statement and they\'ll appear here.</p>')
        return

    parts = []
    for t in tables:
        try:
            cnt = con.execute(f'SELECT count(*) FROM "{t}"').fetchone()[0]
        except Exception:
            cnt = "?"
        cols = con.execute(
            "SELECT column_name, data_type FROM information_schema.columns "
            "WHERE table_schema = 'main' AND table_name = ? ORDER BY ordinal_position",
            [t],
        ).fetchall()
        safe = _html.escape(t)
        parts.append(f'<div class="tbl" data-table="{safe}">')
        parts.append(
            f'<button class="tbl-row" data-toggle="{safe}">'
            f'<span class="caret">▶</span><span class="tw">{safe}</span>'
            f'<span class="peek" data-peek="{safe}">preview</span>'
            f'<span class="n">{cnt}</span></button>'
        )
        parts.append('<div class="cols">')
        for c, dt in cols:
            parts.append(f'<div class="col">{_html.escape(c)}<span>{_html.escape(dt)}</span></div>')
        parts.append("</div></div>")
    box.innerHTML = "".join(parts)


def show_result(cols, rows, types, ms, note=None):
    global last
    out = el("output")
    if cols:
        last = {"cols": list(cols), "rows": [list(r) for r in rows]}
        out.innerHTML = render_table(cols, rows, types)
        extra = " (showing first 2000)" if len(rows) > 2000 else ""
        set_status(f"{len(rows)} rows · {ms} ms{extra}", "ok")
    else:
        last = {"cols": [], "rows": []}
        out.innerHTML = f'<p class="msg">{note or "Statement finished. Nothing to show."}</p>'
        set_status(f"done · {ms} ms", "ok")


def execute(sql):
    out = el("output")
    statements = split_statements(sql)
    if not statements:
        out.innerHTML = '<p class="msg">Nothing to run. Write a query first.</p>'
        set_status("empty", "err")
        return

    set_status("running…")
    t0 = time.time()
    cols, rows, types, done = [], [], None, 0
    try:
        for stmt in statements:
            rel = con.sql(stmt)
            done += 1
            if rel is not None and rel.columns:
                cols, types = rel.columns, rel.types
                rows = rel.fetchall()
    except Exception as e:
        ms = int((time.time() - t0) * 1000)
        out.innerHTML = (f'<p class="msg err">Statement {done + 1} failed after {ms} ms\n\n'
                         f'{_html.escape(str(e))}</p>')
        set_status("error", "err")
        refresh_schema()
        return

    ms = int((time.time() - t0) * 1000)
    note = f"{done} statement(s) ran. No rows returned."
    show_result(cols, rows, types, ms, note)
    refresh_schema()


@when("click", "#run-btn")
def _run(event):
    execute(el("sql").value.strip())


@when("click", "#clear-btn")
def _clear(event):
    global last
    last = {"cols": [], "rows": []}
    el("output").innerHTML = '<p class="msg">Cleared.</p>'
    set_status("ready")


@when("click", "#refresh-btn")
def _refresh(event):
    refresh_schema()


@when("click", "#schema")
def _schema_click(event):
    target = event.target
    peek = target.closest("[data-peek]") if hasattr(target, "closest") else None
    if peek is not None:
        name = peek.getAttribute("data-peek")
        execute(f'SELECT * FROM "{name}" LIMIT 100')
        return
    row = target.closest(".tbl") if hasattr(target, "closest") else None
    if row is not None:
        row.classList.toggle("open")


@when("click", "#csv-btn")
def _csv(event):
    if not last["cols"]:
        set_status("nothing to export", "err")
        return

    def esc(v):
        v = "" if v is None else str(v)
        return '"' + v.replace('"', '""') + '"' if any(c in v for c in ',"\n') else v

    lines = [",".join(esc(c) for c in last["cols"])]
    lines += [",".join(esc(c) for c in r) for r in last["rows"]]
    a = document.createElement("a")
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent("\n".join(lines))
    a.download = "result.csv"
    a.click()


execute(el("sql").value.strip())
el("hint").innerText = "Ctrl/⌘ + Enter to run"
</script>
</body>
</html>
